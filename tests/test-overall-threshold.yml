name: Test overall_threshold input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # 'minor' is the least strict threshold — job should not fail
          # unless GitHub itself is having a minor or worse incident
          overall_threshold: minor
      - name: Assert action completed with overall_threshold set
        run: |
          echo "Action completed with overall_threshold=minor"
          echo "PASS"
