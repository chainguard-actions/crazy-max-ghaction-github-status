name: Test overall threshold (critical)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run GitHub Status action with overall_threshold set to critical
        id: action
        uses: .
        with:
          overall_threshold: critical
      - name: Assert action completed successfully with critical threshold
        run: |
          echo "Action completed with overall_threshold=critical"
          echo "PASS"
