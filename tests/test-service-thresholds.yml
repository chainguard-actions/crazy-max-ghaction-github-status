name: Test multiple service thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Run GitHub Status action with multiple service thresholds
        uses: .
        with:
          git_threshold: major_outage
          api_threshold: major_outage
          webhooks_threshold: major_outage
          issues_threshold: major_outage
          prs_threshold: major_outage
          actions_threshold: major_outage
          packages_threshold: major_outage
          pages_threshold: major_outage
          codespaces_threshold: major_outage
          copilot_threshold: major_outage
      - name: Assert action completed successfully with service thresholds
        run: |
          echo "Action completed without error (all service thresholds=major_outage)"
          echo "PASS"
